<main class="page-shell">
  <section class="editor">

    <div class="editor-container">
      <div class="editor-heading">

        <p class="eyebrow">Draft</p>
        <h1>Create new survey</h1>

        <button type="button" class="close-button" aria-label="Close survey editor"
          (click)="closeEditor()">

          <span aria-hidden="true"> Cancel</span>
          <img src="../assets/imgs/close.svg" alt="Close">
        </button>
      </div>

    <form id="survey-form" [formGroup]="form" (ngSubmit)="publish()">
      <div class="field-grid">
        <div class="survey-meta">

          <label>
            <span>Survey name</span>
            <span class="input-row">
              <input formControlName="title" placeholder="e.g. Summer team event" />
              <button type="button" class="clear-field" aria-label="Clear survey name" (click)="clearField('title')">Delete</button>
            </span>
          </label>

          <div class="meta-row">
            <label>
              <span>Set end date <span>(optional)</span></span>
              <span class="input-row">
                <input type="date" formControlName="endDate" />
                <button type="button" class="clear-field" aria-label="Clear end date" (click)="clearField('endDate')">Delete</button>
              </span>
            </label>
          <label>Choose category<select formControlName="category">
                @for (category of categories; track category) {
                <option [value]="category">{{ category }}</option>}
              </select>
          </label>
          </div>
        </div>

        <label>
          <span>Describing text <span>(optional)</span></span>
          <span class="input-row">
            <textarea formControlName="description" placeholder="What should participants know?"></textarea>
            <button type="button" class="clear-field" aria-label="Clear describing text" (click)="clearField('description')">Delete</button>
          </span>
        </label>

      </div>

      <div formArrayName="questions" class="qustions-form">
        @for (question of questions.controls; track $index; let i = $index) {
        <section class="editor-question" [formGroupName]="i">
          <div class="question-top">
            <strong>Question {{ i + 1 }}</strong>
          </div>
          <label>
            <span>Question</span>
            <span class="input-row">
              <input formControlName="text" placeholder="What would you like to know?" />
              <button type="button" class="clear-field" aria-label="Clear question" (click)="clearQuestion(i)">Delete</button>
            </span>
          </label>
          <label class="multiple-choice">
            <span class="label-row">Answers <span class="multiple-choice-label"><input type="checkbox" formControlName="allowMultiple" /> Allow multiple answers.</span></span>
          </label>
          <div formArrayName="options" class="option-inputs">
            @for (option of options(i).controls; track $index; let j = $index) {
            <div class="option-row">
              <span class="option-letter">{{ answerLetter(j) }}.</span>
              <input [formControlName]="j" [placeholder]="'Answer ' + (j + 1)" [attr.aria-label]="'Answer ' + (j + 1)"
                title="Answer option" />
              @if (j < 2) {
              <button type="button" class="clear-field" [attr.aria-label]="'Clear answer ' + answerLetter(j)" (click)="clearOption(i, j)">Delete</button>
              } @else {
              <button type="button" class="clear-field" [attr.aria-label]="'Delete answer ' + answerLetter(j)" (click)="removeOption(i, j)">Delete</button>
              }
            </div>
            }
            <button type="button" class="add-option" (click)="addOption(i)">
              + Add answer
            </button>
          </div>
        </section>
        }
      </div>

      <button type="button" class="add-question" (click)="addQuestion()">
        + Add new question
      </button>

      </form>

      <div class="form-actions">
        <button class="button" type="submit" form="survey-form" [disabled]="form.invalid">Publish</button>
      </div>
    </div>
  </section>
</main>
